name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'poe_calculator/**'
  workflow_dispatch:  # ручной запуск из веб-интерфейса

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: poe_calculator
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          .venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --distpath dist\windows --workpath build\windows PoECalculator.spec

      - name: Verify executable exists
        run: |
          if not exist dist\windows\PoECalculator.exe (
            echo "EXE not found!"
            exit 1
          )
          echo "Build successful!"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoECalculator-windows
          path: poe_calculator/dist/windows/PoECalculator.exe
          retention-days: 30

      - name: Show file size
        run: |
          for %%F in (dist\windows\PoECalculator.exe) do echo File size: %%~zF bytes (%%~zF / 1024 / 1024 MB)

  # Опционально: сборка Linux для полноты
  build-linux:
    name: Build Linux ELF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: poe_calculator
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libgl1 libegl1

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Make build script executable
        run: chmod +x build_linux.sh

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller --noconfirm --clean --distpath dist/linux --workpath build/linux PoECalculator.spec

      - name: Verify executable exists
        run: |
          if [ ! -f dist/linux/PoECalculator ]; then
            echo "Executable not found!"
            exit 1
          fi
          echo "Build successful!"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoECalculator-linux
          path: poe_calculator/dist/linux/PoECalculator
          retention-days: 30

      - name: Show file size
        run: |
          ls -lh dist/linux/PoECalculator